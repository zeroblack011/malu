# Cloudflare Workers Configuration
name = "malu-digital-services"
main = "worker/index.js"
compatibility_date = "2024-01-01"

# Workers Sites - Serve static assets (PWA)
[site]
bucket = "./public"

# KV Namespaces
[[kv_namespaces]]
binding = "USERS_KV"
id = "your_users_kv_namespace_id" # Replace with your KV namespace ID
preview_id = "your_users_kv_preview_id"

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "your_orders_kv_namespace_id" # Replace with your KV namespace ID
preview_id = "your_orders_kv_preview_id"

# Environment Variables (non-sensitive)
[vars]
ASAAS_ENVIRONMENT = "sandbox" # Change to "production" for live

# Secrets (sensitive data - set with: wrangler secret put ASAAS_API_KEY)
# wrangler secret put ASAAS_API_KEY
# wrangler secret put JWT_SECRET

# Routes
routes = [
  { pattern = "malu.digital/*", zone_name = "malu.digital" }
]

# Usage Model
usage_model = "bundled"

# Build configuration
[build]
command = "echo 'No build step required'"

# Development
[env.development]
vars = { ASAAS_ENVIRONMENT = "sandbox" }

# Production
[env.production]
vars = { ASAAS_ENVIRONMENT = "production" }

# Compatibility
compatibility_flags = ["nodejs_compat"]
